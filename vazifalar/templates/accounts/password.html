{% extends "base.html" %}
{% block title %}Parol{% endblock %}
{% block body %}
<div class="page">
  <div class="head"><div><h1>Parolni o'zgartirish</h1></div></div>
  {% if me.must_change_password %}<p class="pwnote">Sizga vaqtinchalik parol berilgan. Davom etish uchun o'z parolingizni qo'ying.</p>{% endif %}
  <form class="sect" method="post" style="max-width:360px">{% csrf_token %}
    <label class="lbl" for="o">Hozirgi parol</label><input class="pw" id="o" type="password" name="old" autocomplete="current-password" required>
    <label class="lbl" for="n">Yangi parol (kamida 8 belgi)</label><input class="pw" id="n" type="password" name="new" autocomplete="new-password" minlength="8" required>
    <label class="lbl" for="a">Yangi parol yana</label><input class="pw" id="a" type="password" name="again" autocomplete="new-password" minlength="8" required>
    <div><button class="btn pri" type="submit">Saqlash</button></div>
  </form>
</div>
{% endblock %}
